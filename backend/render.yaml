services:
  - type: web
    name: line-oa-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-production.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTO_SEND_LOW_RISK
        value: true
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
