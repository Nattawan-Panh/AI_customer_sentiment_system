<!doctype html>
<html lang='th'>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>Knowledge Base</title>
        <link rel='stylesheet' href='css/style.css'>
    </head>


    <body>
        <div class='layout'>
            <aside class='sidebar'>
                <div class='brand'>LINE Sentiment AI</div>
                <nav class='nav'><a href='index.html'>Dashboard</a>
                    <a href='comments.html'>LINE Comments</a>
                    <a href='review.html'>Human Review</a>
                    <a href='notifications.html'>Notifications</a>
                    <a href='knowledge.html'>Knowledge Base</a>
                    <a href='brand.html'>Brand Setting</a>
                    <a href='models.html'>Model Management</a>
                    <a href='feedback.html'>Feedback</a>
                    <a href='logs.html'>Error Logs</a>
                    <a href="#" onclick="logout()">Logout</a>
                </nav>
            </aside>
            <main class='main'>
                <div class='header'>
                    <div>
                        <h1>Knowledge Base</h1>
                        <p class='small'>FAQ / Product Info / Policy / Promotion</p>
                    </div>
                </div>
                <div class='card'>
                    <div class='form-row'>
                        <input id='kbTitle' placeholder='หัวข้อ'>
                        <select id='kbType'>
                            <option value='faq'>FAQ</option>
                            <option value='product'>Product Info</option>
                            <option value='policy'>Policy</option>
                            <option value='promotion'>Promotion</option>
                        </select>
                    </div>
                    <textarea id='kbContent' placeholder='รายละเอียดข้อมูล'></textarea>
                    <br><br><button id='addKb'>Add Knowledge</button>
                </div>
                <div id='kbList'></div>
            </main>
        </div>
        <script type='module' src='js/firebase-config.js'></script>
        <script type='module' src='js/auth-guard.js'></script>
        <script type='module' src='js/knowledge.js'></script>
    </body>
</html>
